<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>You're offline · Nova</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080808;color:#f7f7fb;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,420px);text-align:center}
    .mark{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 24px;border-radius:24px;background:linear-gradient(135deg,#9b5cff,#5425d8);font-size:38px;font-weight:800}
    h1{margin:0 0 10px;font-size:30px}
    p{margin:0 auto 24px;color:#b9b9c6}
    button{border:0;border-radius:14px;padding:13px 22px;background:#8b5cf6;color:white;font-weight:700;font-size:16px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">N</div>
    <h1>You're offline</h1>
    <p>Nova couldn't connect to the internet. Check your connection and try again. Any features that need an online connection may not be available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
