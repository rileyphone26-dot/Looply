name: Deploy Looply TikTok Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/tiktok-auth/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-tiktok-edge-function.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nova
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy TikTok Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.PROJECT_NOVA }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing repository secrets DEPLOY_TOKEN or PROJECT_NOVA."
            exit 1
          fi
          supabase functions deploy tiktok-auth --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
