<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Nova — short videos, your way. Watch, create and share short videos with your community.">
  <title>Nova</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/launchericon-192x192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">◉</span><span>Nova</span></div>
      <button class="text-btn" id="followingBtn">Following</button>
      <button class="text-btn active" id="forYouBtn">For You</button>
      <button class="install-app-btn" id="installAppBtn" type="button" hidden>Install</button>
      <button class="search-btn" id="searchBtn" aria-label="Search">⌕</button>
    </header>
    <section id="feed" class="feed" aria-label="Short video feed"></section>
    <input id="firstUpload" type="file" accept="video/*" hidden>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item selected" data-page="home"><span>⌂</span><small>Home</small></button>
      <button class="nav-item" data-page="discover"><span>⌕</span><small>Discover</small></button>
      <button class="create-btn" id="uploadBtn" aria-label="Upload video">＋</button>
      <button class="nav-item" data-page="inbox"><span>▢</span><small>Inbox</small></button>
      <button class="nav-item" data-page="profile"><span>♙</span><small>Profile</small></button>
    </nav>
    <input id="uploadInput" type="file" accept="video/*" hidden>
    <dialog id="authDialog">
      <div class="dialog-inner auth-inner">
        <div class="dialog-heading"><strong id="authTitle">Welcome to Nova</strong><button class="close-btn" id="closeAuthBtn" aria-label="Close">✕</button></div>
        <p class="muted" id="authMessage">Sign in or create an account to set up your Nova profile.</p>
        <form id="authForm">
          <label class="auth-field" id="displayNameWrap">Display name<input id="displayNameInput" type="text" maxlength="40" autocomplete="name" placeholder="What should we call you?"></label>
          <label class="auth-field">Email<input id="emailInput" type="email" autocomplete="email" required placeholder="you@example.com"></label>
          <label class="auth-field">Password<input id="passwordInput" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"></label>
          <button class="auth-submit" id="authSubmit" type="submit">Create account</button>
        </form>
        <button class="auth-switch" id="authSwitch" type="button">Already have an account? Sign in</button>
        <div id="signedInPanel" hidden>
          <p id="signedInEmail" class="signed-in-email"></p>
          <button class="auth-submit" id="signOutBtn" type="button">Sign out</button>
        </div>
      </div>
    </dialog>
    <dialog id="commentDialog">
      <form method="dialog" class="dialog-inner">
        <div class="dialog-heading"><strong>Comments</strong><button class="close-btn">✕</button></div>
        <p class="muted">Comments are a local demo in this version.</p>
        <div id="commentList" class="comment-list"></div>
        <div class="comment-form"><input id="commentInput" placeholder="Add a comment…" maxlength="240"><button id="sendComment" type="button">Post</button></div>
      </form>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    // PWABuilder-style service worker registration, scoped to the GitHub Pages app folder.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(registration => {
            console.log('Nova service worker registered for scope:', registration.scope);
          })
          .catch(error => {
            console.error('Nova service worker registration failed:', error);
          });
      });
    } else {
      console.error('Service workers are not supported in this browser.');
    }
  </script>
</body>
</html>
